name: PHP tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0']

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, json
          coverage: none
      - name: Lint production PHP
        run: find . -path './tests' -prune -o -path './dev' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  characterization:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, json
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer test
