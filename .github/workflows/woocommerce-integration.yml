name: WooCommerce integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woo-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transactional-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s
          --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: intl, json, mysqli, redis
          coverage: none
      - name: Install WP-CLI
        run: |
          curl --fail --location --retry 3 -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  /tmp/wp-cli.phar' | sha256sum --check --strict
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          wp --version
      - name: Provision isolated WordPress 7.1 and WooCommerce 11.0.1
        env:
          WP_PATH: /tmp/qtx-woo-wordpress
        run: |
          mkdir -p "$WP_PATH"
          wp core download --version=7.1 --path="$WP_PATH" --force
          wp config create --path="$WP_PATH" --dbname=wordpress --dbuser=root --dbpass='' --dbhost=127.0.0.1:3306 --skip-check
          wp config set WP_REDIS_HOST 127.0.0.1 --path="$WP_PATH"
          wp config set WP_REDIS_PORT 6379 --raw --path="$WP_PATH"
          wp config set WP_REDIS_PREFIX "qtx-woo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}:" --path="$WP_PATH"
          wp config set WP_ENVIRONMENT_TYPE local --path="$WP_PATH"
          QTX_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          wp core install --path="$WP_PATH" --url=http://qtx.test --title='QTX Woo Lab' --admin_user=qtx-admin --admin_password="$QTX_ADMIN_PASSWORD" --admin_email=nobody@example.test --skip-email
          unset QTX_ADMIN_PASSWORD
          wp plugin install woocommerce --version=11.0.1 --activate --path="$WP_PATH"
          wp option update woocommerce_custom_orders_table_enabled yes --path="$WP_PATH"
          wp option update woocommerce_custom_orders_table_data_sync_enabled yes --path="$WP_PATH"
          wp plugin install redis-cache --version=2.8.0 --activate --path="$WP_PATH"
          wp redis enable --path="$WP_PATH"
          ln -s "$GITHUB_WORKSPACE" "$WP_PATH/wp-content/plugins/qtranslate-xt"
          wp plugin activate qtranslate-xt --path="$WP_PATH"
          wp option update qtranslate_enabled_languages --format=json '["lv","ru","en"]' --path="$WP_PATH"
          wp option update qtranslate_default_language en --path="$WP_PATH"
      - name: Execute WooCommerce transactional matrix
        env:
          WP_PATH: /tmp/qtx-woo-wordpress
        run: |
          wp option patch update qtranslate_modules_state woo-commerce 2 --path="$WP_PATH"
          wp eval-file "$GITHUB_WORKSPACE/tests/Integration/WooCommerce/store-api-core-bootstrap.php" --path="$WP_PATH"
          wp option patch update qtranslate_modules_state woo-commerce 1 --path="$WP_PATH"
          wp eval-file "$GITHUB_WORKSPACE/tests/Integration/WooCommerce/transaction-matrix.php" --path="$WP_PATH"
      - name: Build and inspect exact release-candidate archive
        run: |
          git archive --format=zip --prefix=qtranslate-xt/ --output=/tmp/qtranslate-xt-4.0.0-rc1.zip "$GITHUB_SHA" -- qtranslate.php readme.txt license.txt changelog-qtranslate-x.md CHANGELOG.md UPGRADE.md css dist flags i18n-config.json i18n-config img lang src
          test "$(unzip -Z1 /tmp/qtranslate-xt-4.0.0-rc1.zip | cut -d/ -f1 | sort -u)" = 'qtranslate-xt'
          test -n "$(unzip -Z1 /tmp/qtranslate-xt-4.0.0-rc1.zip | grep '^qtranslate-xt/lang/qtranslate-lv.mo$')"
          if unzip -Z1 /tmp/qtranslate-xt-4.0.0-rc1.zip | grep -E '(^|/)(\.git|\.github|tests|dev|js|node_modules|vendor|build)(/|$)|\.(po|pot|sql|sqlite|db)$'; then
            echo 'Forbidden development or private content is present in the release archive.' >&2
            exit 1
          fi
          unzip -Z1 /tmp/qtranslate-xt-4.0.0-rc1.zip | wc -l
          sha256sum /tmp/qtranslate-xt-4.0.0-rc1.zip
      - name: Install and exercise the exact release-candidate archive
        env:
          WP_PATH: /tmp/qtx-woo-wordpress
        run: |
          wp plugin deactivate qtranslate-xt --path="$WP_PATH"
          test -L "$WP_PATH/wp-content/plugins/qtranslate-xt"
          unlink "$WP_PATH/wp-content/plugins/qtranslate-xt"
          wp plugin install /tmp/qtranslate-xt-4.0.0-rc1.zip --activate --path="$WP_PATH"
          test ! -L "$WP_PATH/wp-content/plugins/qtranslate-xt"
          QTX_RC_PHASE=prepare wp eval-file "$GITHUB_WORKSPACE/tests/Integration/release-candidate-smoke.php" --path="$WP_PATH"
          wp plugin deactivate qtranslate-xt --path="$WP_PATH"
          wp plugin activate qtranslate-xt --path="$WP_PATH"
          QTX_RC_PHASE=verify wp eval-file "$GITHUB_WORKSPACE/tests/Integration/release-candidate-smoke.php" --path="$WP_PATH"
      - name: Exercise exact-ZIP HTTP language and REST routes
        env:
          WP_PATH: /tmp/qtx-woo-wordpress
        run: |
          wp rewrite structure '/%postname%/' --path="$WP_PATH"
          page_id="$(wp post create --post_type=page --post_status=publish --post_title='[:lv]QTX_HTTP_LV[:ru]QTX_HTTP_RU[:en]QTX_HTTP_EN[:]' --post_content='[:lv]QTX_HTTP_BODY_LV[:ru]QTX_HTTP_BODY_RU[:en]QTX_HTTP_BODY_EN[:]' --porcelain --path="$WP_PATH")"
          wp option update show_on_front page --path="$WP_PATH"
          wp option update page_on_front "$page_id" --path="$WP_PATH"
          wp option update home 'http://qtx.test:8097' --path="$WP_PATH"
          wp option update siteurl 'http://qtx.test:8097' --path="$WP_PATH"
          wp eval-file "$GITHUB_WORKSPACE/tests/Integration/WooCommerce/system-page-fallback.php" --path="$WP_PATH"

          http_origin='http://qtx.test:8097'
          curl_resolve='qtx.test:8097:127.0.0.1'

          php -S 127.0.0.1:8097 -t "$WP_PATH" "$GITHUB_WORKSPACE/tests/Integration/http-router.php" >/tmp/qtx-http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --resolve "$curl_resolve" --output /dev/null "$http_origin/"; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/qtx-http-server.log
              exit 1
            fi
            sleep 1
          done

          check_language_route() {
            route="$1"
            expected="$2"
            output="/tmp/qtx-http-${expected}.html"
            curl --fail --silent --show-error --location --max-redirs 5 --resolve "$curl_resolve" "${http_origin}${route}" --output "$output" || { cat /tmp/qtx-http-server.log; exit 1; }
            grep --fixed-strings "$expected" "$output"
            if grep --fixed-strings '[:lv]' "$output"; then
              echo "Raw multilingual markers leaked from ${route}." >&2
              exit 1
            fi
          }

          check_language_route '/lv/' 'QTX_HTTP_LV'
          check_language_route '/ru/' 'QTX_HTTP_RU'
          check_language_route '/en/' 'QTX_HTTP_EN'
          check_language_route '/ru/cart/' 'QTX_WOO_SYSTEM_CART'
          fixture_product_id="$(wp option get qtx_system_page_fixture_product_id --path="$WP_PATH")"
          curl --fail --silent --show-error --location --max-redirs 5 --resolve "$curl_resolve" --cookie-jar /tmp/qtx-system-page.cookies "${http_origin}/lv/?add-to-cart=${fixture_product_id}" --output /tmp/qtx-system-page-add.html
          curl --fail --silent --show-error --location --max-redirs 5 --resolve "$curl_resolve" --cookie /tmp/qtx-system-page.cookies "${http_origin}/lv/checkout/" --output /tmp/qtx-http-QTX_WOO_SYSTEM_CHECKOUT.html
          grep --fixed-strings 'QTX_WOO_SYSTEM_CHECKOUT' /tmp/qtx-http-QTX_WOO_SYSTEM_CHECKOUT.html
          check_language_route '/ru/my-account/' 'QTX_WOO_SYSTEM_MYACCOUNT'
          curl --fail --silent --show-error --location --max-redirs 5 --resolve "$curl_resolve" "$http_origin/wp-json/" --output /tmp/qtx-http-rest.json
          grep --fixed-strings '"namespaces"' /tmp/qtx-http-rest.json
          curl --fail --silent --show-error --location --max-redirs 5 --resolve "$curl_resolve" "$http_origin/wp-json/wc/store/v1/cart" --output /tmp/qtx-http-store-cart.json
          grep --fixed-strings '"items"' /tmp/qtx-http-store-cart.json
      - name: Publish the validated release-candidate archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qtranslate-xt-4.0.0-rc1
          path: /tmp/qtranslate-xt-4.0.0-rc1.zip
          if-no-files-found: error
          compression-level: 0
      - name: Prove persistent cache backend remains connected
        if: always()
        env:
          WP_PATH: /tmp/qtx-woo-wordpress
        run: wp redis status --path="$WP_PATH"
